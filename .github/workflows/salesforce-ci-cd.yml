name: Salesforce CI/CD

on:
  pull_request:
    branches: [ "sit", "int", "prod" ]
  push:
    branches: [ "sit", "int", "prod" ]

jobs:
  validate-sit:
    if: ${{ github.ref_name == 'sit' }}
    name: Validate SIT
    runs-on: ubuntu-latest
    steps:
      # same steps as before, but SIT-specific
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest
      - name: Install Git Delta plugin
        run: echo y | sf plugins install sfdx-git-delta
      - name: Auth SIT
        env:
          SFDX_AUTH_URL: ${{ secrets.SIT_SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias SIT
      - name: Prepare Delta Directory
        run: mkdir -p delta
      - name: Generate Delta
        run: sf sgd source delta --to ${{ github.event.pull_request.head.sha }} --from ${{ github.event.pull_request.base.sha }} --output delta
      - name: Validate Deployment
        run: sf project deploy validate --manifest delta/package/package.xml --target-org SIT
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta-artifact-sit
          path: delta/
          retention-days: 30

  deploy-sit:
    needs: validate-sit
    if: ${{ needs.validate-sit.result == 'success' }}
    name: Deploy SIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest
      - name: Install Git Delta plugin
        run: echo y | sf plugins install sfdx-git-delta
      - name: Auth SIT
        env:
          SFDX_AUTH_URL: ${{ secrets.SIT_SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias SIT
      - uses: actions/download-artifact@v4
        with:
          name: delta-artifact-sit
      - name: Deploy to SIT
        run: sf project deploy start --manifest delta/package/package.xml --target-org SIT --ignore-conflicts
