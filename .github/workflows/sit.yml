name: SIT Deployment

on:
  pull_request:
    branches: [ "sit" ]
  push:
    branches: [ "sit" ]

jobs:
  validate-deploy-sit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Install Git Delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Auth SIT
        run: |
          echo "${{ secrets.SIT_SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias SIT

      - name: Generate Delta (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./scripts/delta.sh ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }}

      - name: Generate Delta (Push)
        if: ${{ github.event_name == 'push' }}
        run: ./scripts/delta.sh ${{ github.sha }} ${{ github.event.before }}

      - name: Validate Deployment
        run: |
          TEST_CLASSES=$(grep -oPm1 "(?<=<members>)[^<]+" delta/package/package.xml | grep "Test" || true)
          if [ -z "$TEST_CLASSES" ]; then TEST_CLASSES="SmokeTests"; fi
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org SIT \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES"
