name: SIT Validation (PR)

on:
  pull_request:
    branches: [ "sit" ]
    types: [opened, reopened, synchronize]

jobs:
  validate-sit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta
      - run: chmod +x scripts/*.sh
      - name: Auth SIT
        run: |
          echo "${{ secrets.SIT_SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias SIT
      - name: Generate Delta
        run: |
          TO_SHA=${{ github.event.pull_request.head.sha }}
          FROM_SHA=${{ github.event.pull_request.base.sha }}
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          ./scripts/delta.sh $TO_SHA $FROM_SHA
      - name: Validate Deployment
        run: |
          if [ ! -s delta/package/package.xml ]; then
            echo "No changes detected, skipping validation."
            exit 0
          fi
          TEST_CLASSES=$(grep -oPm1 "(?<=<members>)[^<]+" delta/package/package.xml | grep "Test" || true)
          if [ -z "$TEST_CLASSES" ]; then TEST_CLASSES="SmokeTests"; fi
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org SIT \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES"
