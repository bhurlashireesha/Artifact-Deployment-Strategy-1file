name: INT Deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ "int" ]
  push:
    tags:
      - "INT-*"

jobs:
  validate-int-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta
      - run: chmod +x scripts/*.sh
      - name: Auth INT
        run: |
          echo "${{ secrets.INT_SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias INT
      - name: Generate Delta
        run: |
          TO_SHA=${{ github.event.pull_request.head.sha }}
          FROM_SHA=${{ github.event.pull_request.base.sha }}
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          ./scripts/delta.sh $TO_SHA $FROM_SHA
      - name: Validate Deployment
        run: |
          if [ ! -s delta/package/package.xml ]; then
            echo "No changes detected, skipping validation."
            exit 0
          fi
          TEST_CLASSES=$(grep -oPm1 "(?<=<members>)[^<]+" delta/package/package.xml | grep "Test" || true)
          if [ -z "$TEST_CLASSES" ]; then TEST_CLASSES="SmokeTests"; fi
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org INT \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES"

  create-int-tag:
    needs: validate-int-pr
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine next tag
        id: tag
        run: |
          # Fetch all tags
          git fetch --tags
          LAST_TAG=$(git tag --list "INT-*" | sort -V | tail -n1)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="INT-release1Sprint1-v1.0"
          else
            # Extract numeric version at the end (vX.Y)
            VERSION=$(echo $LAST_TAG | grep -oE 'v[0-9]+\.[0-9]+$' | sed 's/v//')
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            NEW_MINOR=$((MINOR+1))
            NEW_TAG="INT-release1Sprint1-v${MAJOR}.${NEW_MINOR}"
          fi

          echo "New tag will be $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

  validate-int-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/INT-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta
      - run: chmod +x scripts/*.sh
      - name: Auth INT
        run: |
          echo "${{ secrets.INT_SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias INT
      - name: Generate Delta
        run: |
          TO_SHA=${{ github.sha }}
          FROM_SHA=${{ github.event.before }}
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          ./scripts/delta.sh $TO_SHA $FROM_SHA
      - name: Validate Deployment (tag)
        run: |
          if [ ! -s delta/package/package.xml ]; then
            echo "No changes detected, skipping validation."
            exit 0
          fi
          TEST_CLASSES=$(grep -oPm1 "(?<=<members>)[^<]+" delta/package/package.xml | grep "Test" || true)
          if [ -z "$TEST_CLASSES" ]; then TEST_CLASSES="SmokeTests"; fi
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org INT \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES"

  deploy-int:
    needs: validate-int-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta
      - run: chmod +x scripts/*.sh
      - name: Auth INT
        run: |
          echo "${{ secrets.INT_SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias INT
      - name: Generate Delta
        run: |
          TO_SHA=${{ github.sha }}
          FROM_SHA=${{ github.event.before }}
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          ./scripts/delta.sh $TO_SHA $FROM_SHA
      - name: Deploy to INT
        run: |
          if [ ! -s delta/package/package.xml ]; then
            echo "No changes detected, skipping deployment."
            exit 0
          fi
          TEST_CLASSES=$(grep -oPm1 "(?<=<members>)[^<]+" delta/package/package.xml | grep "Test" || true)
          if [ -z "$TEST_CLASSES" ]; then TEST_CLASSES="SmokeTests"; fi
          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org INT \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES"